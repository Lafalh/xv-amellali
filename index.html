<style>
:root{
  --tinta:        #33391F;
  --pergamino:    #FBF7EA;
  --pergamino-2:  #F1EEE3;
  --rosa-viejo:   #A6822C;
  --oro:          #C9A227;
  --blanco-calido:#FFFFFF;
  --display: "Cormorant Garamond", serif;
  --texto:   "Jost", sans-serif;
  --sombra: 0 18px 40px -18px rgba(51,57,31,.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:var(--texto);
  background:var(--pergamino);
  color:var(--tinta);
  min-height:100vh;
}
.envoltura{ max-width:1000px; margin:0 auto; padding:60px 24px 90px; }
h1,h2{ font-family:var(--display); font-weight:500; }
.ojo-de-cerradura{ text-transform:uppercase; letter-spacing:.22em; font-size:.68rem; color:var(--oro); font-weight:500; }

.divisor{ width:110px; height:30px; margin:16px auto 0; color:var(--oro); }
.divisor svg{ width:100%; height:100%; }

.cabecera{ text-align:center; margin-bottom:36px; max-width:640px; margin-left:auto; margin-right:auto; }
.cabecera h1{ font-size:2.1rem; font-style:italic; margin-top:10px; }

.resumen{
  display:flex; justify-content:center; gap:32px; flex-wrap:wrap;
  margin:8px auto 40px; text-align:center; max-width:640px;
}
.resumen .num{ font-family:var(--display); font-size:1.7rem; color:var(--oro); }
.resumen .lbl{ font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; opacity:.65; }

.boton{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 22px; border:1px solid var(--oro); background:transparent; color:var(--tinta);
  font-family:var(--texto); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
  cursor:pointer; text-decoration:none;
}
.boton:hover{ background:var(--oro); color:var(--blanco-calido); }
.boton--solido{ background:var(--oro); color:var(--blanco-calido); }
.boton--solido:hover{ background:var(--tinta); border-color:var(--tinta); }
.fila-botones{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:44px; }

/* -------- carta de dedicatoria -------- */
.carta{
  background:var(--blanco-calido);
  border-radius:2px;
  box-shadow:var(--sombra);
}
.carta .corazon{
  width:24px; height:24px; margin:0 auto 14px; color:var(--oro); display:block;
}
.carta .mensaje{
  font-family:var(--display); font-style:italic; font-size:1.08rem; line-height:1.6;
  text-align:center; color:var(--tinta);
}
.carta .firma{
  margin-top:18px; text-align:right; font-family:var(--display); font-style:italic; font-size:1.02rem;
  color:var(--rosa-viejo);
}
.carta .firma .personas{
  display:block; font-family:var(--texto); font-style:normal; font-size:.66rem;
  letter-spacing:.06em; text-transform:uppercase; opacity:.6; margin-top:2px;
}
.carta .fecha{
  display:block; text-align:center; margin-top:14px;
  font-size:.62rem; letter-spacing:.05em; opacity:.4;
}

/* -------- carrusel tipo "álbum": varias tarjetas visibles, la del
   centro grande y las de los lados chicas y tenues, en loop -------- */
.carrusel{
  display:flex; align-items:center; justify-content:center; gap:14px;
  max-width:100%; margin:0 auto; padding:10px 0;
}
.carrusel-slot{
  flex:0 0 auto;
  transition:flex-basis .5s cubic-bezier(.4,0,.2,1), min-height .5s cubic-bezier(.4,0,.2,1), opacity .5s ease, transform .5s cubic-bezier(.4,0,.2,1);
}
.carrusel-slot .carta{
  width:100%; height:100%; padding:26px 22px;
  display:flex; flex-direction:column; justify-content:center;
}
/* centro: tarjeta completa. min-height (no height fija) para que si el
   mensaje es largo la tarjeta crezca en vez de recortar el texto. */
.carrusel-slot[data-nivel="0"]{ flex-basis:340px; min-height:430px; opacity:1; z-index:3; }
.carrusel-slot[data-nivel="0"] .carta{ padding:40px 36px; }
.carrusel-slot[data-nivel="0"] .mensaje{ font-size:1.22rem; }
/* vecinos inmediatos: versión reducida */
.carrusel-slot[data-nivel="1"]{ flex-basis:170px; min-height:260px; opacity:.75; z-index:2; }
.carrusel-slot[data-nivel="1"] .carta{ padding:20px 16px; }
/* extremos: solo una pista de que hay más */
.carrusel-slot[data-nivel="2"]{ flex-basis:100px; min-height:170px; opacity:.4; z-index:1; }
.carrusel-slot[data-nivel="2"] .carta{ padding:14px 10px; }

.mini-corazon{ width:18px; height:18px; margin:0 auto 9px; color:var(--oro); }
.mini-nombre{
  text-align:center; font-family:var(--display); font-style:italic; font-size:.88rem;
  color:var(--tinta); line-height:1.3; overflow-wrap:break-word;
}

@media (max-width:760px){
  .carrusel{ gap:8px; }
  .carrusel-slot[data-nivel="0"]{ flex-basis:250px; min-height:360px; }
  .carrusel-slot[data-nivel="0"] .carta{ padding:28px 22px; }
  .carrusel-slot[data-nivel="0"] .mensaje{ font-size:1.08rem; }
  .carrusel-slot[data-nivel="1"]{ flex-basis:120px; min-height:210px; }
  .carrusel-slot[data-nivel="2"]{ flex-basis:74px; min-height:140px; }
}
@media (max-width:480px){
  .carrusel-slot[data-nivel="2"]{ display:none; }
  .carrusel-slot[data-nivel="0"]{ flex-basis:210px; min-height:340px; }
  .carrusel-slot[data-nivel="0"] .carta{ padding:24px 18px; }
  .carrusel-slot[data-nivel="0"] .mensaje{ font-size:1rem; }
  .carrusel-slot[data-nivel="1"]{ flex-basis:90px; min-height:190px; }
}

.carrusel-controles{
  display:flex; justify-content:center; align-items:center; gap:26px;
  margin-top:24px;
}
.btn-flecha{
  width:44px; height:44px; border-radius:50%;
  border:1px solid var(--oro); background:transparent; color:var(--tinta);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; padding:0; flex:0 0 auto;
}
.btn-flecha:hover{ background:var(--oro); color:var(--blanco-calido); }
.btn-flecha svg{ width:18px; height:18px; }
.carrusel-indicador{
  text-align:center; margin-top:12px;
  font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--rosa-viejo);
}

.seccion-titulo{ margin:50px auto 16px; text-align:center; max-width:640px; }
.seccion-titulo h2{ font-size:1.2rem; font-style:italic; }

.vacio, .estado{ text-align:center; opacity:.6; padding:30px 10px; font-size:.9rem; }
.oculto{ display:none; }

.nav-sitio{ display:flex; background:var(--tinta); }
.nav-sitio a{
  flex:1 1 auto; text-align:center; padding:14px 12px;
  color:var(--pergamino); text-decoration:none;
  font-family:var(--texto); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase;
  border-right:1px solid rgba(255,255,255,.14);
  transition:background .25s ease, color .25s ease;
}
.nav-sitio a:last-child{ border-right:none; }
.nav-sitio a:hover{ background:var(--oro); color:#fff; }

/* ============================================================
   TEMA XV AÑOS — victoriano en rosa baby + dorado + blanco
   (mismo estilo que invitacion.html). Va al final del <style>
   para ganarle a los valores que venían de la boda.
   ============================================================ */
:root{
  --tinta:#5B3A41; --pergamino:#FFFAF8; --pergamino-2:#F5E1E7;
  --rosa-viejo:#8F6B17; --oro:#C9A227; --salvia:#C9637F; --alerta:#B3413C;
  --blanco:#FFFFFF; --blanco-calido:#FFFFFF;
  --titulo:#A64D69; --vino:#F6C9D5;
  --display:"Cormorant Garamond", serif; --texto:"Jost", sans-serif;
  --capitular:"Cinzel Decorative", serif;
  --sombra:0 18px 40px -18px rgba(150,80,100,.38);
}
body{
  background-color:var(--pergamino);
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2714%27%20height%3D%2714%27%20viewBox%3D%270%200%2014%2014%27%3E%3Ccircle%20cx%3D%273%27%20cy%3D%277%27%20r%3D%271.6%27%20fill%3D%27%23C9A227%27%2F%3E%3Ccircle%20cx%3D%279%27%20cy%3D%277%27%20r%3D%271.6%27%20fill%3D%27%23C9A227%27%2F%3E%3C%2Fsvg%3E"), url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2714%27%20height%3D%2714%27%20viewBox%3D%270%200%2014%2014%27%3E%3Ccircle%20cx%3D%273%27%20cy%3D%277%27%20r%3D%271.6%27%20fill%3D%27%23C9A227%27%2F%3E%3Ccircle%20cx%3D%279%27%20cy%3D%277%27%20r%3D%271.6%27%20fill%3D%27%23C9A227%27%2F%3E%3C%2Fsvg%3E"), url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%20viewBox%3D%270%200%20160%20160%27%3E%20%3Cg%20fill%3D%27none%27%20stroke%3D%27%23E3A9BA%27%20stroke-opacity%3D%27.26%27%20stroke-width%3D%271.3%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%20%3Cpath%20d%3D%27M80%2C14%20C70%2C24%2062%2C38%2068%2C52%20C72%2C60%2064%2C66%2058%2C60%20C52%2C54%2058%2C46%2064%2C50%27%2F%3E%20%3Cpath%20d%3D%27M68%2C52%20C56%2C40%2042%2C36%2030%2C42%20C42%2C46%2052%2C54%2068%2C52%20Z%27%2F%3E%20%3Cpath%20d%3D%27M80%2C58%20C64%2C60%2050%2C72%2052%2C88%20C54%2C100%2070%2C102%2072%2C92%20C73%2C86%2066%2C84%2064%2C88%27%2F%3E%20%3Cpath%20d%3D%27M80%2C104%20C72%2C114%2058%2C120%2046%2C116%20C40%2C114%2040%2C106%2046%2C106%27%2F%3E%20%3Cpath%20d%3D%27M80%2C128%20C70%2C132%2062%2C140%2064%2C150%27%2F%3E%20%3Cpath%20d%3D%27M54%2C74%20C44%2C72%2034%2C78%2032%2C88%20C40%2C84%2048%2C82%2054%2C74%20Z%27%2F%3E%3Cg%20transform%3D%27translate%28160%200%29%20scale%28-1%201%29%27%3E%3Cpath%20d%3D%27M80%2C14%20C70%2C24%2062%2C38%2068%2C52%20C72%2C60%2064%2C66%2058%2C60%20C52%2C54%2058%2C46%2064%2C50%27%2F%3E%20%3Cpath%20d%3D%27M68%2C52%20C56%2C40%2042%2C36%2030%2C42%20C42%2C46%2052%2C54%2068%2C52%20Z%27%2F%3E%20%3Cpath%20d%3D%27M80%2C58%20C64%2C60%2050%2C72%2052%2C88%20C54%2C100%2070%2C102%2072%2C92%20C73%2C86%2066%2C84%2064%2C88%27%2F%3E%20%3Cpath%20d%3D%27M80%2C104%20C72%2C114%2058%2C120%2046%2C116%20C40%2C114%2040%2C106%2046%2C106%27%2F%3E%20%3Cpath%20d%3D%27M80%2C128%20C70%2C132%2062%2C140%2064%2C150%27%2F%3E%20%3Cpath%20d%3D%27M54%2C74%20C44%2C72%2034%2C78%2032%2C88%20C40%2C84%2048%2C82%2054%2C74%20Z%27%2F%3E%3C%2Fg%3E%20%3Cpath%20d%3D%27M80%2C60%20C73%2C72%2073%2C88%2080%2C100%20C87%2C88%2087%2C72%2080%2C60%20Z%27%2F%3E%3Ccircle%20cx%3D%2780%27%20cy%3D%2780%27%20r%3D%273%27%2F%3E%3Cpath%20d%3D%27M80%2C104%20L80%2C128%27%2F%3E%20%3C%2Fg%3E%3C%2Fsvg%3E");
  background-repeat:repeat-y, repeat-y, repeat;
  background-position:left top, right top, top left;
  background-size:14px 14px, 14px 14px, 180px 180px;
}
h1{ font-family:var(--capitular) !important; font-style:normal !important; font-weight:700 !important; color:var(--titulo); letter-spacing:.01em; }
h2, h3{ color:var(--titulo); }
.ojo-de-cerradura, header p.sub{ color:var(--rosa-viejo) !important; }
.nav-sitio{ background:var(--vino) !important; border-bottom:2px solid var(--oro); }
.nav-sitio a{ color:var(--tinta) !important; font-weight:500; border-right-color:rgba(201,162,39,.45) !important; }
.nav-sitio a:hover{ background:var(--titulo) !important; color:#FFFFFF !important; }
.boton{ border-radius:999px !important; }
.boton:hover{ background:var(--oro); color:#FFFFFF; }
.boton--solido{ background:var(--titulo) !important; border-color:var(--titulo) !important; color:#FFFFFF !important; }
.boton--solido:hover{ background:var(--oro) !important; border-color:var(--oro) !important; }
.carta, .tarjeta, .tarjeta-lugar, .fila-invitado{ border-radius:16px !important; outline:1px solid var(--oro); outline-offset:-6px; }

.cabecera h1{ font-size:clamp(1.6rem, 6vw, 2.3rem); }
.resumen .num{ font-family:var(--capitular); font-weight:700; color:var(--titulo); }
.carta .corazon, .mini-corazon{ color:var(--salvia); }
.carta .mensaje{ font-size:1.18rem; }
.seccion-titulo h2{ font-family:var(--capitular); font-style:normal; font-weight:700; font-size:1.25rem; }
.btn-flecha{ border-color:var(--oro); }

/* ============================================================
   MEJORAS UX (guías ui-ux-pro-max) — comunes a los paneles
   ============================================================ */
:focus-visible{ outline:2px solid var(--titulo); outline-offset:2px; }
a, button, select, .chip, .pestana{ -webkit-tap-highlight-color:transparent; }
.ico{ width:17px; height:17px; flex:0 0 auto; }
.boton{ display:inline-flex !important; align-items:center; justify-content:center; gap:8px;
        min-height:40px; cursor:pointer; transition:background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease; }
.boton:active{ transform:translateY(1px); }
.boton[disabled]{ opacity:.5; cursor:not-allowed; }
.nav-sitio a{ display:flex; align-items:center; justify-content:center; min-height:48px; font-size:.7rem !important; letter-spacing:.1em !important; }
/* letras de apoyo nunca menores a ~12px */
.lbl, .dato .lbl, .resumen .lbl{ font-size:.72rem !important; letter-spacing:.06em !important; }
/* carga */
.spinner{ display:inline-block; width:18px; height:18px; margin-right:10px; vertical-align:-4px;
          border:2px solid var(--pergamino-2); border-top-color:var(--titulo); border-radius:50%; animation:girar .8s linear infinite; }
@keyframes girar{ to{ transform:rotate(360deg); } }
/* avisos breves (toast) */
.toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%, 20px); z-index:100;
        background:var(--tinta); color:#fff; padding:12px 20px; border-radius:999px; font-size:.9rem;
        box-shadow:0 12px 30px -10px rgba(91,58,65,.6); opacity:0; pointer-events:none;
        transition:opacity .25s ease, transform .25s ease; max-width:calc(100% - 32px); text-align:center; }
.toast.ver{ opacity:1; transform:translate(-50%, 0); }
@media (pointer:coarse){
  .boton, .chip, .pestana{ min-height:44px; }
  .chip{ display:inline-flex !important; align-items:center; padding:0 16px !important; }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

/* encabezado más compacto: lo importante (cifras y lista) sube */
.envoltura{ padding-top:34px !important; }
.cabecera{ margin-bottom:22px !important; }
.cabecera h1{ font-size:clamp(1.5rem, 6.5vw, 2.2rem) !important; }
/* cifras en tarjetitas */
.resumen{ display:grid !important; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:10px !important;
          max-width:680px !important; margin:0 auto 18px !important; }
.resumen > div{ background:var(--blanco); border:1px solid var(--pergamino-2); border-radius:14px; padding:12px 6px;
                box-shadow:0 8px 20px -16px rgba(150,80,100,.6); }
.resumen .num{ font-size:1.6rem !important; line-height:1.1; }
.resumen .lbl{ opacity:.85 !important; color:var(--rosa-viejo); }
.fila-botones{ margin-bottom:6px !important; }
.ultima-act{ text-align:center; font-size:.78rem; color:var(--rosa-viejo); min-height:1.2em; margin-bottom:30px; }
.estado{ font-size:.95rem; }
/* buscador de dedicatorias */
.seccion-titulo{ display:flex; flex-direction:column; align-items:center; gap:12px; }
.buscador{ display:flex; align-items:center; gap:8px; width:100%; max-width:420px; padding:0 14px; min-height:44px;
           background:var(--blanco); border:1px solid var(--pergamino-2); border-radius:999px; color:var(--rosa-viejo); }
.buscador input{ flex:1; border:none; background:transparent; font-family:var(--texto); font-size:.95rem; color:var(--tinta); min-height:42px; }
.buscador input:focus{ outline:none; }
.buscador:focus-within{ border-color:var(--titulo); box-shadow:0 0 0 3px rgba(166,77,105,.15); }

/* -------- solo dedicatorias: muro con todas -------- */
.resumen{ max-width:320px !important; }
.todas{ margin-top:56px; }
.todas .seccion-titulo h2{ font-size:1.35rem; }
.muro{ columns:3 260px; column-gap:16px; max-width:1000px; margin:20px auto 0; }
.nota{ break-inside:avoid; margin:0 0 16px; background:var(--blanco); border-radius:16px;
       outline:1px solid var(--oro); outline-offset:-6px; box-shadow:0 10px 24px -18px rgba(150,80,100,.7);
       padding:22px 20px 18px; text-align:center; }
.nota-corazon{ width:18px; height:18px; color:#E48AA3; display:block; margin:0 auto 10px; }
.nota blockquote{ margin:0; font-family:var(--display); font-style:italic; font-size:1.12rem; line-height:1.55; color:var(--tinta); }
.nota figcaption{ margin-top:14px; font-family:var(--display); font-style:italic; font-size:1.02rem; color:var(--titulo); }
.nota figcaption span{ display:block; margin-top:2px; font-family:var(--texto); font-style:normal; font-size:.72rem; letter-spacing:.05em; color:var(--rosa-viejo); }
.todas .vacio.oculto{ display:none; }

  <div class="resumen" id="resumen"></div>

  <div class="fila-botones">
    <button class="boton" id="btn-actualizar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>Actualizar</button>
  </div>
  <p class="ultima-act" id="ultima-act"></p>

  <div id="estado" class="estado" role="status" aria-live="polite"></div>
  <div id="cont-dedicatorias"></div>

  <!-- Todas las dedicatorias completas (la lista de invitados vive en confirmacion.html) -->
  <section class="todas" id="seccion-todas" hidden>
    <div class="seccion-titulo">
      <h2>Todas las dedicatorias</h2>
      <label class="buscador"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="search" id="buscar-dedicatoria" placeholder="Buscar por nombre o palabra…" aria-label="Buscar dedicatoria"></label>
    </div>
    <div class="muro" id="muro-dedicatorias"></div>
    <p class="vacio oculto" id="sin-resultados">Ninguna dedicatoria coincide con la búsqueda.</p>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const SVG_CORAZON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10.1-9.3C.4 8.7 1.9 5 5.4 4.3c2-.4 3.9.5 5 2.1a5.9 5.9 0 0 1 5-2.1c3.5.7 5 4.4 3.5 7.4C19.5 16.4 12 21 12 21z"/></svg>`;

$("titulo-panel").textContent = "Dedicatorias para " + CONFIG.nombreQuinceanera;

function formatearFecha(iso){
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("es-MX", { day:"numeric", month:"short", year:"numeric" });
  } catch { return iso; }
}

function escaparHTML(texto){
  const div = document.createElement("div");
  div.textContent = texto || "";
  return div.innerHTML;
}

/* silencioso = refresco automático: no borra la pantalla, solo repinta si
   cambió algo, y conserva la dedicatoria que se está viendo en el carrusel. */
let ultimaFirma = "", pedido = 0;
async function cargarDatos(silencioso){
  const mio = ++pedido;
  if (!silencioso){
    $("estado").innerHTML = '<span class="spinner" aria-hidden="true"></span>Cargando…';
    $("cont-dedicatorias").innerHTML = "";
    $("muro-dedicatorias").innerHTML = "";
    $("resumen").innerHTML = "";
  }

  if (!CONFIG.urlConfirmaciones || CONFIG.urlConfirmaciones.startsWith("PEGA_AQUI")) {
    $("estado").textContent = "Falta configurar la conexión: pega la URL /exec del Apps Script en ajustes.js (ver CONFIGURACION.md, paso 7).";
    return;
  }

  if (location.protocol === "file:") {
    $("estado").innerHTML =
      "Este archivo se abrió directamente desde tu computadora (doble clic), y los " +
      "navegadores bloquean ese tipo de conexión por seguridad.<br><br>" +
      "Solución: sube <code>index.html</code> a donde tengas hospedada " +
      "la invitación (GitHub Pages, Netlify, Vercel o Firebase Hosting) y ábrelo " +
      "desde esa URL en vez de abrir el archivo local.";
    return;
  }

  try {
    const url = `${CONFIG.urlConfirmaciones}?accion=invitados`;
    const resp = await fetch(url);
    if (!resp.ok && silencioso) throw new Error("HTTP " + resp.status);
    if (!resp.ok) {
      $("estado").textContent = `El servidor respondió con un error (código ${resp.status}). Revisa que la URL de CONFIG.urlConfirmaciones sea exactamente la misma que en invitacion.html.`;
      return;
    }
    const datos = await resp.json();
    if (mio !== pedido) return;   // llegó tarde: ya hay una consulta más nueva

    if (!datos.ok && silencioso) throw new Error(datos.error || "respuesta inválida");
    if (!datos.ok) {
      $("estado").textContent = "No se pudieron cargar los datos: " + (datos.error || "error desconocido") + ".";
      return;
    }

    $("estado").textContent = "";
    if (vivo) vivo.marcar();
    // Cada invitado de la pestaña "Invitados" es una confirmación (se registran al confirmar)
    const lista = (datos.invitados || []).map(i => Object.assign({}, i, { pases: i.total, asiste: "Sí" }));
    const firma = JSON.stringify(lista);
    if (silencioso && firma === ultimaFirma) return;   // nada nuevo
    ultimaFirma = firma;
    pintarDatos(lista, silencioso);
  } catch (err) {
    if (silencioso) throw err;
    $("estado").innerHTML =
      "No se pudo conectar.<br><br>" +
      "<strong>Detalle técnico:</strong> " + escaparHTML(err.message) + "<br><br>" +
      "Revisa: 1) que la URL de CONFIG.urlConfirmaciones sea correcta y termine en " +
      "<code>/exec</code>, 2) que en Google Apps Script, en \"Quién tiene acceso\", " +
      "esté puesto \"Cualquier usuario\", y 3) que hayas creado una \"Nueva versión\" " +
      "al implementar después de cualquier cambio.";
  }
}

let listaDedicatorias = [];
let indiceActual = 0;

const SVG_FLECHA_IZQ = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`;
const SVG_FLECHA_DER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;

function renderCarta(c){
  return `
    <div class="carta">
      <div class="corazon">${SVG_CORAZON}</div>
      <p class="mensaje">«${escaparHTML(c.mensaje)}»</p>
      <p class="firma">${escaparHTML(c.nombre)}
        <span class="personas">${textoPersonas(c)}</span>
      </p>
      <span class="fecha">${formatearFecha(c.fecha)}</span>
    </div>`;
}

function textoPersonas(c){
  // Confirmaciones viejas (sin desglose) solo traen el total en `pases`
  if (!c.adultos && !c.ninos) return `${c.pases} persona${c.pases === 1 ? "" : "s"}`;
  const partes = [`${c.adultos} adulto${c.adultos === 1 ? "" : "s"}`];
  if (c.ninos) partes.push(`${c.ninos} niño${c.ninos === 1 ? "" : "s"}`);
  return partes.join(" · ");
}

function renderCartaMini(c){
  return `
    <div class="carta">
      <div class="mini-corazon">${SVG_CORAZON}</div>
      <p class="mini-nombre">${escaparHTML(c.nombre)}</p>
    </div>`;
}

// Cuántas tarjetas como máximo se muestran a la vez (centro + 2 de cada
// lado = 5). Por rendimiento, sin importar cuántas dedicatorias haya en
// total, nunca se dibujan más de estas al mismo tiempo.
const RADIO_VENTANA_MAX = 2;

function radioVentana(total){
  return Math.min(RADIO_VENTANA_MAX, Math.floor((total - 1) / 2));
}

function indicesVentana(centro, total){
  const radio = radioVentana(total);
  const idxs = [];
  for (let k = -radio; k <= radio; k++){
    idxs.push({ k, idx: ((centro + k) % total + total) % total });
  }
  return idxs;
}

let tecladoListo = false;
function mostrarCarrusel(conservar){
  const cont = $("cont-dedicatorias");

  if (listaDedicatorias.length === 0) {
    cont.innerHTML = `<p class="vacio">Todavía no hay dedicatorias. Aparecerán aquí en cuanto algún invitado escriba una al confirmar.</p>`;
    return;
  }

  indiceActual = conservar ? Math.min(indiceActual, listaDedicatorias.length - 1) : 0;
  cont.innerHTML = `
    <div class="carrusel" id="carrusel-pista"></div>
    ${listaDedicatorias.length > 1 ? `
      <div class="carrusel-controles">
        <button class="btn-flecha" id="btn-prev" aria-label="Dedicatoria anterior">${SVG_FLECHA_IZQ}</button>
        <button class="btn-flecha" id="btn-next" aria-label="Dedicatoria siguiente">${SVG_FLECHA_DER}</button>
      </div>
      <p class="carrusel-indicador" id="carrusel-indicador"></p>
    ` : ""}
  `;

  renderVentana();

  if (listaDedicatorias.length > 1) {
    actualizarIndicador();
    $("btn-prev").addEventListener("click", () => cambiarCarta(-1));
    $("btn-next").addEventListener("click", () => cambiarCarta(1));
    if (!tecladoListo){ document.addEventListener("keydown", manejarTeclado); tecladoListo = true; }
  }
}

function renderVentana(){
  const pista = $("carrusel-pista");
  const ventana = indicesVentana(indiceActual, listaDedicatorias.length);
  pista.innerHTML = ventana.map(({ k, idx }) => {
    const nivel = Math.abs(k);
    const c = listaDedicatorias[idx];
    return `<div class="carrusel-slot" data-nivel="${nivel}">${nivel === 0 ? renderCarta(c) : renderCartaMini(c)}</div>`;
  }).join("");
}

function manejarTeclado(ev){
  if (!document.getElementById("carrusel-pista")) return;
  if (ev.key === "ArrowLeft") cambiarCarta(-1);
  if (ev.key === "ArrowRight") cambiarCarta(1);
}

function actualizarIndicador(){
  $("carrusel-indicador").textContent = `${indiceActual + 1} / ${listaDedicatorias.length}`;
}

function cambiarCarta(direccion){
  if (listaDedicatorias.length <= 1) return;
  const pista = $("carrusel-pista");
  if (pista.dataset.animando === "1") return;
  pista.dataset.animando = "1";

  indiceActual = (indiceActual + direccion + listaDedicatorias.length) % listaDedicatorias.length;
  // Al re-dibujar, cada tarjeta que se queda en la ventana pasa suavemente
  // de su tamaño/opacidad anterior al nuevo (gracias a la transición en
  // .carrusel-slot), dando la sensación de que se van acomodando en su
  // nuevo lugar sin desaparecer de golpe.
  renderVentana();
  actualizarIndicador();

  // Además, deslizamos todo el carrusel: arrancan un poco desplazadas
  // hacia el lado por donde "entra" el contenido nuevo, y se acomodan
  // deslizándose hasta su posición final.
  const slots = document.querySelectorAll("#carrusel-pista .carrusel-slot");
  slots.forEach(slot => {
    slot.style.transition = "none";
    slot.style.transform = `translateX(${direccion * 50}px)`;
  });
  void pista.offsetWidth; // fuerza el reflow para que la siguiente transición sí anime
  slots.forEach(slot => {
    slot.style.transition = "transform .5s cubic-bezier(.4,0,.2,1), flex-basis .5s cubic-bezier(.4,0,.2,1), min-height .5s cubic-bezier(.4,0,.2,1), opacity .5s ease";
    slot.style.transform = "translateX(0)";
  });

  setTimeout(() => { pista.dataset.animando = "0"; }, 520);
}

function pintarDatos(confirmaciones, conservar){
  const confirmados = confirmaciones.filter(c => c.asiste === "Sí");
  const conMensaje = confirmaciones.filter(c => c.mensaje && c.mensaje.trim());

  // Este panel es solo de dedicatorias; los totales de personas, adultos y
  // niños están en el panel Invitados (confirmacion.html).
  $("resumen").innerHTML = `
    <div><div class="num">${conMensaje.length}</div><div class="lbl">Dedicatorias</div></div>
    <div><div class="num">${confirmados.length}</div><div class="lbl">Confirmaron</div></div>
  `;

  listaDedicatorias = conMensaje;
  mostrarCarrusel(conservar);

  // Muro con todas las dedicatorias completas, para leerlas sin pasar una por una
  $("seccion-todas").hidden = conMensaje.length === 0;
  $("muro-dedicatorias").innerHTML = conMensaje.map(c => `
    <figure class="nota">
      <svg class="nota-corazon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-10.1-9.3C.4 8.7 1.9 5 5.4 4.3c2-.4 3.9.5 5 2.1a5.9 5.9 0 0 1 5-2.1c3.5.7 5 4.4 3.5 7.4C19.5 16.4 12 21 12 21z"/></svg>
      <blockquote>«${escaparHTML(c.mensaje)}»</blockquote>
      <figcaption>${escaparHTML(c.nombre)}<span>${formatearFecha(c.fecha)}</span></figcaption>
    </figure>`).join("");
  filtrarMuro();
}

function filtrarMuro(){
  const normal = t => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const q = normal($("buscar-dedicatoria").value.trim());
  let visibles = 0;
  document.querySelectorAll("#muro-dedicatorias .nota").forEach(n => {
    const ver = !q || normal(n.textContent).includes(q);
    n.style.display = ver ? "" : "none";
    if (ver) visibles++;
  });
  $("sin-resultados").classList.toggle("oculto", visibles > 0 || !q);
}

$("btn-actualizar").addEventListener("click", () => cargarDatos(false));
$("buscar-dedicatoria").addEventListener("input", filtrarMuro);

// Refresco automático cada 20 s (se pausa con la pestaña oculta)
let vivo = null;
if (CONFIG.urlConfirmaciones && !CONFIG.urlConfirmaciones.startsWith("PEGA_AQUI") && location.protocol !== "file:"){
  vivo = EnVivo.iniciar({ contenedor: $("ultima-act"), actualizar: () => cargarDatos(true), cada: 20 });
}
cargarDatos();
</script>
</body>
</html>
