<style>
:root{
  --tinta:#33391F; --pergamino:#FBF7EA; --pergamino-2:#F1EEE3; --blanco:#FFFFFF;
  --rosa-viejo:#A6822C; --oro:#C9A227; --salvia:#8B9A5B; --alerta:#B3413C;
  --display:"Cormorant Garamond",serif; --texto:"Jost",sans-serif;
  --sombra:0 14px 34px -16px rgba(51,57,31,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{ height:100%; }
body{
  font-family:var(--texto); background:var(--pergamino); color:var(--tinta); font-size:14px;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
h1,h2{ font-family:var(--display); font-weight:500; }

.nav-sitio{ flex:0 0 auto; display:flex; background:var(--tinta); }
.nav-sitio a{
  flex:1 1 auto; text-align:center; padding:12px 10px;
  color:var(--pergamino); text-decoration:none;
  font-family:var(--texto); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  border-right:1px solid rgba(255,255,255,.14);
  transition:background .25s ease, color .25s ease;
}
.nav-sitio a:last-child{ border-right:none; }
.nav-sitio a:hover{ background:var(--oro); color:#fff; }

header{ flex:0 0 auto; padding:16px 24px 12px; border-bottom:1px solid var(--pergamino-2); background:var(--blanco);
        display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; }
header p.sub{ font-size:.72rem; color:var(--rosa-viejo); letter-spacing:.14em; text-transform:uppercase; }
header h1{ font-size:1.4rem; font-style:italic; margin-top:2px; }
.acciones{ display:flex; gap:8px; flex-wrap:wrap; }

.resumen{ flex:0 0 auto; display:flex; flex-wrap:wrap; gap:0; padding:11px 24px; background:var(--blanco); border-bottom:1px solid var(--pergamino-2); }
.dato{ padding:2px 22px 2px 0; margin-right:22px; border-right:1px solid var(--pergamino-2); }
.dato:last-child{ border-right:none; }
.dato .num{ font-family:var(--display); font-size:1.3rem; color:var(--tinta); line-height:1.1; }
.dato .lbl{ font-size:.6rem; color:var(--rosa-viejo); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
.dato.alerta .num{ color:var(--alerta); }

.barra{ flex:0 0 auto; padding:12px 24px; border-bottom:1px solid var(--pergamino-2); background:var(--blanco); }
.barra input[type=text]{
  width:100%; max-width:420px; padding:10px 12px; border:1px solid var(--pergamino-2);
  background:var(--pergamino); font-family:inherit; font-size:.9rem; border-radius:3px;
}

.lista-invitados{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  display:grid; grid-template-columns:1fr; gap:12px; align-content:start;
  max-width:1200px; width:100%; margin:0 auto; padding:18px 24px 40px;
}
@media (min-width:680px){ .lista-invitados{ grid-template-columns:1fr 1fr; } }
@media (min-width:1000px){ .lista-invitados{ grid-template-columns:1fr 1fr 1fr; } }
.fila-invitado{
  display:flex; flex-direction:column; gap:10px;
  background:var(--blanco); border:1px solid var(--pergamino-2); border-radius:3px;
  padding:14px 16px;
}
.fila-invitado .nombre{ font-weight:500; font-size:.95rem; }
.fila-invitado .cont{ font-size:.72rem; color:var(--rosa-viejo); margin-top:2px; }
.fila-mesas{ display:flex; flex-wrap:wrap; gap:6px; }
.pastilla-mesa{
  display:inline-flex; align-items:center; gap:4px; padding:4px 11px; border-radius:14px;
  font-size:.72rem; background:var(--pergamino); border:1px solid var(--pergamino-2);
}
.pastilla-mesa .n{ font-family:var(--display); font-style:italic; color:var(--rosa-viejo); }
.pendiente{ font-size:.72rem; color:var(--alerta); font-weight:500; }
.acciones-fila{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:2px; }

.boton{
  font-family:var(--texto); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid var(--oro); background:transparent; color:var(--tinta);
  padding:8px 14px; border-radius:2px; cursor:pointer; text-decoration:none; display:inline-block;
}
.boton:hover{ background:var(--oro); color:#fff; }
.boton--solido{ background:var(--oro); color:#fff; }
.boton--solido:hover{ background:var(--tinta); border-color:var(--tinta); }

.vacio, .estado{ text-align:center; opacity:.6; padding:40px 12px; font-size:.9rem; }
.oculto{ display:none; }

/* ============================================================
   TEMA XV AÑOS — victoriano en rosa baby + dorado + blanco
   (mismo estilo que invitacion.html). Va al final del <style>
   para ganarle a los valores que venían de la boda.
   ============================================================ */
:root{
  --tinta:#5B3A41; --pergamino:#FFFAF8; --pergamino-2:#F5E1E7;
  --rosa-viejo:#8F6B17; --oro:#C9A227; --salvia:#C9637F; --alerta:#B3413C;
  --blanco:#FFFFFF; --blanco-calido:#FFFFFF;
  --titulo:#A64D69; --vino:#F6C9D5;
  --display:"Cormorant Garamond", serif; --texto:"Jost", sans-serif;
  --capitular:"Cinzel Decorative", serif;
  --sombra:0 18px 40px -18px rgba(150,80,100,.38);
}
body{
  background-color:var(--pergamino);
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2714%27%20height%3D%2714%27%20viewBox%3D%270%200%2014%2014%27%3E%3Ccircle%20cx%3D%273%27%20cy%3D%277%27%20r%3D%271.6%27%20fill%3D%27%23C9A227%27%2F%3E%3Ccircle%20cx%3D%279%27%20cy%3D%277%27%20r%3D%271.6%27%20fill%3D%27%23C9A227%27%2F%3E%3C%2Fsvg%3E"), url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2714%27%20height%3D%2714%27%20viewBox%3D%270%200%2014%2014%27%3E%3Ccircle%20cx%3D%273%27%20cy%3D%277%27%20r%3D%271.6%27%20fill%3D%27%23C9A227%27%2F%3E%3Ccircle%20cx%3D%279%27%20cy%3D%277%27%20r%3D%271.6%27%20fill%3D%27%23C9A227%27%2F%3E%3C%2Fsvg%3E"), url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%20viewBox%3D%270%200%20160%20160%27%3E%20%3Cg%20fill%3D%27none%27%20stroke%3D%27%23E3A9BA%27%20stroke-opacity%3D%27.26%27%20stroke-width%3D%271.3%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%20%3Cpath%20d%3D%27M80%2C14%20C70%2C24%2062%2C38%2068%2C52%20C72%2C60%2064%2C66%2058%2C60%20C52%2C54%2058%2C46%2064%2C50%27%2F%3E%20%3Cpath%20d%3D%27M68%2C52%20C56%2C40%2042%2C36%2030%2C42%20C42%2C46%2052%2C54%2068%2C52%20Z%27%2F%3E%20%3Cpath%20d%3D%27M80%2C58%20C64%2C60%2050%2C72%2052%2C88%20C54%2C100%2070%2C102%2072%2C92%20C73%2C86%2066%2C84%2064%2C88%27%2F%3E%20%3Cpath%20d%3D%27M80%2C104%20C72%2C114%2058%2C120%2046%2C116%20C40%2C114%2040%2C106%2046%2C106%27%2F%3E%20%3Cpath%20d%3D%27M80%2C128%20C70%2C132%2062%2C140%2064%2C150%27%2F%3E%20%3Cpath%20d%3D%27M54%2C74%20C44%2C72%2034%2C78%2032%2C88%20C40%2C84%2048%2C82%2054%2C74%20Z%27%2F%3E%3Cg%20transform%3D%27translate%28160%200%29%20scale%28-1%201%29%27%3E%3Cpath%20d%3D%27M80%2C14%20C70%2C24%2062%2C38%2068%2C52%20C72%2C60%2064%2C66%2058%2C60%20C52%2C54%2058%2C46%2064%2C50%27%2F%3E%20%3Cpath%20d%3D%27M68%2C52%20C56%2C40%2042%2C36%2030%2C42%20C42%2C46%2052%2C54%2068%2C52%20Z%27%2F%3E%20%3Cpath%20d%3D%27M80%2C58%20C64%2C60%2050%2C72%2052%2C88%20C54%2C100%2070%2C102%2072%2C92%20C73%2C86%2066%2C84%2064%2C88%27%2F%3E%20%3Cpath%20d%3D%27M80%2C104%20C72%2C114%2058%2C120%2046%2C116%20C40%2C114%2040%2C106%2046%2C106%27%2F%3E%20%3Cpath%20d%3D%27M80%2C128%20C70%2C132%2062%2C140%2064%2C150%27%2F%3E%20%3Cpath%20d%3D%27M54%2C74%20C44%2C72%2034%2C78%2032%2C88%20C40%2C84%2048%2C82%2054%2C74%20Z%27%2F%3E%3C%2Fg%3E%20%3Cpath%20d%3D%27M80%2C60%20C73%2C72%2073%2C88%2080%2C100%20C87%2C88%2087%2C72%2080%2C60%20Z%27%2F%3E%3Ccircle%20cx%3D%2780%27%20cy%3D%2780%27%20r%3D%273%27%2F%3E%3Cpath%20d%3D%27M80%2C104%20L80%2C128%27%2F%3E%20%3C%2Fg%3E%3C%2Fsvg%3E");
  background-repeat:repeat-y, repeat-y, repeat;
  background-position:left top, right top, top left;
  background-size:14px 14px, 14px 14px, 180px 180px;
}
h1{ font-family:var(--capitular) !important; font-style:normal !important; font-weight:700 !important; color:var(--titulo); letter-spacing:.01em; }
h2, h3{ color:var(--titulo); }
.ojo-de-cerradura, header p.sub{ color:var(--rosa-viejo) !important; }
.nav-sitio{ background:var(--vino) !important; border-bottom:2px solid var(--oro); }
.nav-sitio a{ color:var(--tinta) !important; font-weight:500; border-right-color:rgba(201,162,39,.45) !important; }
.nav-sitio a:hover{ background:var(--titulo) !important; color:#FFFFFF !important; }
.boton{ border-radius:999px !important; }
.boton:hover{ background:var(--oro); color:#FFFFFF; }
.boton--solido{ background:var(--titulo) !important; border-color:var(--titulo) !important; color:#FFFFFF !important; }
.boton--solido:hover{ background:var(--oro) !important; border-color:var(--oro) !important; }
.carta, .tarjeta, .tarjeta-lugar, .fila-invitado{ border-radius:16px !important; outline:1px solid var(--oro); outline-offset:-6px; }

header h1{ font-size:1.5rem; }
.dato .num{ font-family:var(--capitular); font-weight:700; color:var(--titulo); }
.pastilla-mesa{ background:var(--vino); border-color:var(--vino); }
.pastilla-mesa .n{ color:var(--titulo); font-weight:600; }
.barra input[type=text]{ border-radius:999px; padding:10px 16px; }

/* -------- lista ligada por ID -------- */
.filtros{ display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
.chip{ font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; padding:5px 12px; border-radius:999px;
       border:1px solid var(--pergamino-2); background:var(--blanco); color:var(--rosa-viejo); cursor:pointer; }
.chip.on{ background:var(--titulo); border-color:var(--titulo); color:#fff; }
.etiqueta-fila{ font-size:.58rem; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px;
                background:var(--pergamino-2); color:var(--rosa-viejo); margin-left:6px; vertical-align:middle; font-weight:500; }
.etiqueta-fila.alerta{ background:#FBE3E1; color:var(--alerta); }
.posible-dup{ border-color:#E8B4B0 !important; }
.mensaje-fila{ font-family:var(--display); font-style:italic; font-size:.95rem; margin-top:6px; opacity:.85; }
.boton--peligro{ border-color:#D9A3A0 !important; color:var(--alerta) !important; }
.boton--peligro:hover{ background:var(--alerta) !important; color:#fff !important; }

/* ============================================================
   MEJORAS UX (guías ui-ux-pro-max) — comunes a los paneles
   ============================================================ */
:focus-visible{ outline:2px solid var(--titulo); outline-offset:2px; }
a, button, select, .chip, .pestana{ -webkit-tap-highlight-color:transparent; }
.ico{ width:17px; height:17px; flex:0 0 auto; }
.boton{ display:inline-flex !important; align-items:center; justify-content:center; gap:8px;
        min-height:40px; cursor:pointer; transition:background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease; }
.boton:active{ transform:translateY(1px); }
.boton[disabled]{ opacity:.5; cursor:not-allowed; }
.nav-sitio a{ display:flex; align-items:center; justify-content:center; min-height:48px; font-size:.7rem !important; letter-spacing:.1em !important; }
/* letras de apoyo nunca menores a ~12px */
.lbl, .dato .lbl, .resumen .lbl{ font-size:.72rem !important; letter-spacing:.06em !important; }
/* carga */
.spinner{ display:inline-block; width:18px; height:18px; margin-right:10px; vertical-align:-4px;
          border:2px solid var(--pergamino-2); border-top-color:var(--titulo); border-radius:50%; animation:girar .8s linear infinite; }
@keyframes girar{ to{ transform:rotate(360deg); } }
/* avisos breves (toast) */
.toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%, 20px); z-index:100;
        background:var(--tinta); color:#fff; padding:12px 20px; border-radius:999px; font-size:.9rem;
        box-shadow:0 12px 30px -10px rgba(91,58,65,.6); opacity:0; pointer-events:none;
        transition:opacity .25s ease, transform .25s ease; max-width:calc(100% - 32px); text-align:center; }
.toast.ver{ opacity:1; transform:translate(-50%, 0); }
@media (pointer:coarse){
  .boton, .chip, .pestana{ min-height:44px; }
  .chip{ display:inline-flex !important; align-items:center; padding:0 16px !important; }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

/* encabezado y cifras compactas */
header{ padding:14px 20px 12px !important; align-items:center !important; }
header h1{ font-size:1.45rem !important; }
.resumen{ display:grid !important; grid-template-columns:repeat(6, 1fr); gap:8px !important; padding:12px 20px !important; }
.dato{ border:1px solid var(--pergamino-2) !important; border-radius:12px; margin:0 !important; padding:8px 6px !important; text-align:center; background:var(--pergamino); }
.dato .num{ font-size:1.25rem !important; }
.dato.alerta{ background:#FDECEA !important; border-color:#F3C6C2 !important; }
.dato.alerta .num, .dato.alerta .lbl{ color:#A3352F !important; }
.barra{ padding:12px 20px !important; }
.buscador{ display:flex; align-items:center; gap:8px; width:100%; max-width:460px; padding:0 14px; min-height:44px;
           background:var(--blanco); border:1px solid var(--pergamino-2); border-radius:999px; color:var(--rosa-viejo); }
.buscador input{ flex:1; border:none !important; background:transparent !important; font-family:inherit; font-size:.95rem; color:var(--tinta); min-height:42px; padding:0 !important; max-width:none !important; }
.buscador input:focus{ outline:none; }
.buscador:focus-within{ border-color:var(--titulo); box-shadow:0 0 0 3px rgba(166,77,105,.15); }
/* tarjeta de invitado */
.fila-invitado{ gap:8px !important; padding:16px 16px 14px !important; }
.fi-cabeza{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.fila-invitado .nombre{ font-family:var(--texto); font-size:1.02rem !important; font-weight:600; color:var(--tinta); line-height:1.3; margin:0; padding-top:10px; }
.fila-invitado .cont{ display:flex; align-items:center; gap:8px; font-size:.85rem !important; color:var(--tinta) !important; opacity:.85; margin:0 !important; }
.fila-invitado .cont .ico{ color:var(--rosa-viejo); width:16px; height:16px; }
.fi-mesas .fila-mesas{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.badge{ display:inline-flex; align-items:center; font-size:.72rem; font-weight:500; letter-spacing:.03em; padding:4px 10px; border-radius:999px; }
.badge--aviso{ background:#FDECEA; color:#A3352F; }
.acciones-fila{ display:flex !important; flex-wrap:wrap; gap:8px !important; align-items:center; padding-top:6px !important; border-top:1px dashed var(--pergamino-2); margin-top:4px !important; }
.acciones-fila{ flex-wrap:nowrap !important; }
.acciones-fila .boton{ flex:1 1 0; min-width:0; padding-left:10px !important; padding-right:10px !important; white-space:nowrap; }
@media (min-width:680px){ .lista-invitados{ grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)) !important; } }
.btn-icono{ display:inline-flex; align-items:center; justify-content:center; flex:0 0 44px; width:44px; height:44px; border-radius:50%;
            border:1px solid var(--pergamino-2); background:var(--blanco); color:var(--rosa-viejo); cursor:pointer; transition:background .2s, color .2s, border-color .2s; }
.btn-icono:hover{ background:var(--vino); color:var(--titulo); border-color:var(--vino); }
.btn-icono--peligro{ border-color:transparent; background:transparent; color:#B3413C; }
.btn-icono--peligro:hover{ background:#FDECEA; color:#A3352F; border-color:#F3C6C2; }
.estado p{ margin:0; }
/* celular: la página se desplaza normal y el buscador se queda arriba */
@media (max-width:679px){
  html, body{ height:auto !important; }
  body{ display:block !important; overflow:auto !important; }
  .resumen{ grid-template-columns:repeat(3, 1fr); padding:10px 16px !important; }
  header{ padding:12px 16px 10px !important; }
  .barra{ position:sticky; top:0; z-index:10; padding:10px 16px !important; box-shadow:0 8px 16px -14px rgba(91,58,65,.5); }
  .lista-invitados{ overflow:visible !important; padding:14px 16px 40px !important; }
}

.fila-filtros{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 14px; margin-top:9px; }
.fila-filtros .filtros{ margin-top:0 !important; }
.orden{ display:inline-flex; align-items:center; gap:8px; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--rosa-viejo); }
.orden select{ min-height:36px; padding:0 30px 0 12px; border-radius:999px; border:1px solid var(--pergamino-2); background:var(--blanco);
               font-family:var(--texto); font-size:.85rem; color:var(--tinta); text-transform:none; letter-spacing:0; cursor:pointer; }
@media (pointer:coarse){ .orden select{ min-height:44px; } }

</div>

<div id="estado" class="estado" role="status" aria-live="polite">Cargando...</div>
<div class="lista-invitados" id="lista"></div>

<script>
const $ = (id) => document.getElementById(id);

const ICONOS = {"telefono": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z\"/></svg>", "personas": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.9\"/><path d=\"M16 3.1a4 4 0 0 1 0 7.8\"/></svg>", "basura": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 6h18\"/><path d=\"M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><path d=\"M10 11v6M14 11v6\"/><path d=\"M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2\"/></svg>", "link": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7\"/><path d=\"M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7\"/></svg>", "ojo": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>", "chat": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z\"/></svg>"};

/* aviso breve abajo (confirma que una acción sí se hizo) */
function mostrarToast(msg){
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); t.setAttribute("aria-live", "polite"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("ver");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("ver"), 2200);
}

function esc(t){ const d=document.createElement("div"); d.textContent=t||""; return d.innerHTML; }
function normalizar(t){
  return (t||"").trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ");
}

/* Todo se liga por ID: la lista sale de la pestaña "Invitados" (cada quien
   se registra al confirmar) y las mesas del croquis (asign[id]). Los que se
   agregaron a mano en el croquis también aparecen, marcados "a mano". */
let invitados = [];
let croquisActual = { mesas: [], asign: {}, grupos: [] };
let busqueda = "";
let filtro = "todos";
let orden = "nombre";

function formatearFecha(iso){
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString("es-MX", { day: "numeric", month: "short" });
}

function linkInvitado(id){
  const url = new URL(CONFIG.paginaInvitado, location.href);
  url.search = "?id=" + encodeURIComponent(id);
  return url.href;
}
function mesasDe(id){ return croquisActual.asign[id] || {}; }
function sentados(id){ return Object.values(mesasDe(id)).reduce((a,b)=>a+b,0); }
function numeroMesa(mid){ const m = croquisActual.mesas.find(x => x.id === mid); return m ? m.numero : "?"; }

/* WhatsApp: solo dígitos; si son 10 (celular de México) se antepone 52 */
function linkWhatsApp(inv){
  let tel = (inv.telefono || "").replace(/\D/g, "");
  if (!tel) return "";
  if (tel.length === 10) tel = "52" + tel;
  const mesas = Object.keys(mesasDe(inv.id)).map(numeroMesa);
  const texto = `¡Hola ${inv.nombre}! Gracias por confirmar a los XV años de ${CONFIG.nombreQuinceanera}. ` +
    (mesas.length ? `Tu lugar es en la mesa ${mesas.join(" y ")}. ` : "") +
    `Aquí puedes ver tu lugar y los datos del evento: ${linkInvitado(inv.id)}`;
  return `https://wa.me/${tel}?text=${encodeURIComponent(texto)}`;
}

function renderResumen(){
  const personas = invitados.reduce((s,i) => s + i.total, 0);
  const adultos = invitados.reduce((s,i) => s + (i.adultos || 0), 0);
  const ninos = invitados.reduce((s,i) => s + (i.ninos || 0), 0);
  const conMesa = invitados.reduce((s,i) => s + Math.min(sentados(i.id), i.total), 0);
  const sinMesa = personas - conMesa;
  $("resumen").innerHTML = `
    <div class="dato"><div class="num">${invitados.length}</div><div class="lbl">Invitados</div></div>
    <div class="dato"><div class="num">${personas}</div><div class="lbl">Personas</div></div>
    <div class="dato"><div class="num">${adultos}</div><div class="lbl">Adultos</div></div>
    <div class="dato"><div class="num">${ninos}</div><div class="lbl">Niños -12</div></div>
    <div class="dato"><div class="num">${conMesa}</div><div class="lbl">Con mesa</div></div>
    <div class="dato ${sinMesa>0?"alerta":""}"><div class="num">${sinMesa}</div><div class="lbl">Sin mesa</div></div>
  `;
}

function renderLista(){
  // nombres repetidos = posibles duplicados (alguien que confirmó desde dos celulares)
  const cuenta = {};
  invitados.forEach(i => { const k = normalizar(i.nombre); cuenta[k] = (cuenta[k] || 0) + 1; });

  let lista = invitados;
  if (busqueda) lista = lista.filter(i => normalizar(i.nombre).includes(normalizar(busqueda)) || (i.telefono||"").includes(busqueda));
  if (filtro === "sinmesa") lista = lista.filter(i => sentados(i.id) < i.total);
  if (filtro === "duplicados") lista = lista.filter(i => cuenta[normalizar(i.nombre)] > 1);
  lista = lista.slice().sort((a, b) =>
    orden === "recientes" ? String(b.fecha || "").localeCompare(String(a.fecha || "")) :
    orden === "personas"  ? (b.total - a.total) || a.nombre.localeCompare(b.nombre, "es") :
                            a.nombre.localeCompare(b.nombre, "es"));

  if (!lista.length){ $("lista").innerHTML = `<p class="vacio">Sin resultados.</p>`; return; }

  $("lista").innerHTML = lista.map(inv => {
    const mapa = mesasDe(inv.id);
    const ids = Object.keys(mapa);
    const faltan = inv.total - sentados(inv.id);
    const mesasHTML = ids.length
      ? `<div class="fila-mesas">${ids.map(mid => `<span class="pastilla-mesa">Mesa <span class="n">${esc(numeroMesa(mid))}</span> · ${mapa[mid]}</span>`).join("")}
         ${faltan > 0 ? `<span class="badge badge--aviso">${faltan} sin mesa</span>` : ""}</div>`
      : `<span class="badge badge--aviso">Sin mesa asignada</span>`;
    const desglose = `${inv.adultos} adulto${inv.adultos===1?"":"s"}${inv.ninos ? ` · ${inv.ninos} niño${inv.ninos===1?"":"s"}` : ""}`;
    const wa = linkWhatsApp(inv);
    const dup = cuenta[normalizar(inv.nombre)] > 1;
    return `
      <article class="fila-invitado ${dup ? "posible-dup" : ""}">
        <div class="fi-cabeza">
          <h3 class="nombre">${esc(inv.nombre)}
            ${inv.manual ? `<span class="etiqueta-fila">a mano</span>` : ""}
            ${dup ? `<span class="etiqueta-fila alerta">¿duplicado?</span>` : ""}</h3>
          ${inv.manual ? "" : `<button class="btn-icono btn-icono--peligro" data-eliminar="${esc(inv.id)}" data-nombre="${esc(inv.nombre)}" aria-label="Eliminar a ${esc(inv.nombre)}" title="Eliminar">${ICONOS.basura}</button>`}
        </div>
        <div class="cont">${ICONOS.personas}<span><strong>${inv.total}</strong> persona${inv.total===1?"":"s"} · ${desglose}</span></div>
        ${inv.telefono ? `<div class="cont">${ICONOS.telefono}<span>${esc(inv.telefono)}</span></div>` : ""}
        ${inv.fecha ? `<div class="cont">${ICONOS.calendario}<span>Confirmó el ${formatearFecha(inv.fecha)}</span></div>` : ""}
        ${inv.mensaje ? `<div class="mensaje-fila">«${esc(inv.mensaje)}»</div>` : ""}
        <div class="fi-mesas">${mesasHTML}</div>
        <div class="acciones-fila">
          ${wa ? `<a class="boton boton--solido" href="${wa}" target="_blank" rel="noopener">${ICONOS.chat}WhatsApp</a>` : ""}
          <button class="boton" data-copiar="${esc(inv.id)}">${ICONOS.link}Copiar link</button>
          <a class="btn-icono" href="${linkInvitado(inv.id)}" target="_blank" rel="noopener" aria-label="Ver lo que verá ${esc(inv.nombre)}" title="Vista previa">${ICONOS.ojo}</a>
        </div>
      </article>`;
  }).join("");

  $("lista").querySelectorAll("[data-copiar]").forEach(btn => {
    btn.addEventListener("click", () => {
      const url = linkInvitado(btn.dataset.copiar);
      navigator.clipboard.writeText(url).then(() => {
        mostrarToast("Link copiado: ya puedes pegarlo en WhatsApp");
      }).catch(() => { prompt("Copia este link manualmente:", url); });
    });
  });
  $("lista").querySelectorAll("[data-eliminar]").forEach(btn => {
    btn.addEventListener("click", () => eliminar(btn.dataset.eliminar, btn.dataset.nombre, btn));
  });
}

/* Eliminar = Estado "Eliminado" en la hoja (no se borra la fila, se puede
   recuperar cambiando el Estado a "Confirmado" en Google Sheets). */
async function eliminar(id, nombre, btn){
  if (!confirm(`¿Eliminar a "${nombre}" de la lista?\n\nÚsalo para duplicados o confirmaciones por error. Si tenía mesa, su lugar se libera la próxima vez que guardes el croquis.`)) return;
  btn.disabled = true;
  try{
    const r = await fetch(CONFIG.urlConfirmaciones, {
      method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ accion: "eliminarInvitado", id })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "error");
    mostrarToast(`Se eliminó «${nombre}»`);
    cargar();
  }catch(err){
    alert("No se pudo eliminar: " + err.message);
    btn.disabled = false; btn.innerHTML = ICONOS.basura;
  }
}

function renderFiltros(){
  const f = [["todos","Todos"],["sinmesa","Sin mesa"],["duplicados","Posibles duplicados"]];
  $("filtros").innerHTML = f.map(([k,l]) => `<span class="chip ${filtro===k?"on":""}" data-f="${k}">${l}</span>`).join("");
  $("filtros").querySelectorAll("[data-f]").forEach(c => c.addEventListener("click", () => { filtro = c.dataset.f; renderFiltros(); renderLista(); }));
}

async function cargar(){
  $("estado").innerHTML = '<span class="spinner" aria-hidden="true"></span>Cargando…';
  $("estado").classList.remove("oculto");
  $("lista").innerHTML = "";
  $("resumen").innerHTML = "";

  if (!CONFIG.urlConfirmaciones || CONFIG.urlConfirmaciones.startsWith("PEGA_AQUI")){
    $("estado").textContent = "Falta configurar la conexión: pega la URL /exec del Apps Script en ajustes.js (ver CONFIGURACION.md, paso 7).";
    return;
  }
  if (location.protocol === "file:"){
    $("estado").innerHTML =
      "Este archivo se abrió directamente desde tu computadora (doble clic), y los " +
      "navegadores bloquean ese tipo de conexión por seguridad.<br><br>" +
      "Súbelo a donde tengas hospedado el sitio y ábrelo desde esa URL.";
    return;
  }
  try{
    const [ri, rc] = await Promise.all([
      fetch(CONFIG.urlConfirmaciones + "?accion=invitados"),
      fetch(CONFIG.urlConfirmaciones + "?accion=croquis")
    ]);
    const di = await ri.json(), dc = await rc.json();
    if (!di.ok){ $("estado").textContent = "No se pudo leer la lista de invitados."; return; }
    croquisActual = Object.assign({ mesas: [], asign: {}, grupos: [] }, (dc.ok && dc.croquis) || {});
    const manuales = (croquisActual.grupos || []).filter(g => g.origen === "manual")
      .map(g => ({ id: g.id, nombre: g.nombre, total: g.total, adultos: g.total, ninos: 0, telefono: "", mensaje: "", manual: true }));
    invitados = di.invitados.concat(manuales).sort((a,b) => a.nombre.localeCompare(b.nombre, "es"));
    if (!invitados.length){
      $("estado").innerHTML = `<p>Todavía nadie ha confirmado.</p><p style="margin:6px 0 14px;">Comparte el link de la invitación para que empiecen a registrarse.</p>
        <button class="boton boton--solido" id="btn-copiar-invitacion">${ICONOS.link}Copiar link de la invitación</button>`;
      $("btn-copiar-invitacion").addEventListener("click", () => {
        navigator.clipboard.writeText(new URL("invitacion.html", location.href).href).then(() => mostrarToast("Link de la invitación copiado"));
      });
      return;
    }
    $("estado").classList.add("oculto");
    renderResumen();
    renderFiltros();
    renderLista();
  }catch(err){
    $("estado").innerHTML = "No se pudo conectar.<br><br><strong>Detalle técnico:</strong> " + esc(err.message);
  }
}

$("buscar").addEventListener("input", e => { busqueda = e.target.value; renderLista(); });
$("orden").addEventListener("change", e => { orden = e.target.value; renderLista(); });
ICONOS.calendario = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

cargar();
</script>
</body>
</html>
