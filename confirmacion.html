<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitados · XV de Amellali</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --tinta:#33391F; --pergamino:#FBF7EA; --pergamino-2:#F1EEE3; --blanco:#FFFFFF;
  --rosa-viejo:#A6822C; --oro:#C9A227; --salvia:#8B9A5B; --alerta:#B3413C;
  --display:"Cormorant Garamond",serif; --texto:"Jost",sans-serif;
  --sombra:0 14px 34px -16px rgba(51,57,31,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{ height:100%; }
body{
  font-family:var(--texto); background:var(--pergamino); color:var(--tinta); font-size:14px;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
h1,h2{ font-family:var(--display); font-weight:500; }

.nav-sitio{ flex:0 0 auto; display:flex; background:var(--tinta); }
.nav-sitio a{
  flex:1 1 auto; text-align:center; padding:12px 10px;
  color:var(--pergamino); text-decoration:none;
  font-family:var(--texto); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  border-right:1px solid rgba(255,255,255,.14);
  transition:background .25s ease, color .25s ease;
}
.nav-sitio a:last-child{ border-right:none; }
.nav-sitio a:hover{ background:var(--oro); color:#fff; }

header{ flex:0 0 auto; padding:16px 24px 12px; border-bottom:1px solid var(--pergamino-2); background:var(--blanco);
        display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; }
header p.sub{ font-size:.72rem; color:var(--rosa-viejo); letter-spacing:.14em; text-transform:uppercase; }
header h1{ font-size:1.4rem; font-style:italic; margin-top:2px; }
.acciones{ display:flex; gap:8px; flex-wrap:wrap; }

.resumen{ flex:0 0 auto; display:flex; flex-wrap:wrap; gap:0; padding:11px 24px; background:var(--blanco); border-bottom:1px solid var(--pergamino-2); }
.dato{ padding:2px 22px 2px 0; margin-right:22px; border-right:1px solid var(--pergamino-2); }
.dato:last-child{ border-right:none; }
.dato .num{ font-family:var(--display); font-size:1.3rem; color:var(--tinta); line-height:1.1; }
.dato .lbl{ font-size:.6rem; color:var(--rosa-viejo); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
.dato.alerta .num{ color:var(--alerta); }

.barra{ flex:0 0 auto; padding:12px 24px; border-bottom:1px solid var(--pergamino-2); background:var(--blanco); }
.barra input[type=text]{
  width:100%; max-width:420px; padding:10px 12px; border:1px solid var(--pergamino-2);
  background:var(--pergamino); font-family:inherit; font-size:.9rem; border-radius:3px;
}

.lista-invitados{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  display:grid; grid-template-columns:1fr; gap:12px; align-content:start;
  max-width:1200px; width:100%; margin:0 auto; padding:18px 24px 40px;
}
@media (min-width:680px){ .lista-invitados{ grid-template-columns:1fr 1fr; } }
@media (min-width:1000px){ .lista-invitados{ grid-template-columns:1fr 1fr 1fr; } }
.fila-invitado{
  display:flex; flex-direction:column; gap:10px;
  background:var(--blanco); border:1px solid var(--pergamino-2); border-radius:3px;
  padding:14px 16px;
}
.fila-invitado .nombre{ font-weight:500; font-size:.95rem; }
.fila-invitado .cont{ font-size:.72rem; color:var(--rosa-viejo); margin-top:2px; }
.fila-mesas{ display:flex; flex-wrap:wrap; gap:6px; }
.pastilla-mesa{
  display:inline-flex; align-items:center; gap:4px; padding:4px 11px; border-radius:14px;
  font-size:.72rem; background:var(--pergamino); border:1px solid var(--pergamino-2);
}
.pastilla-mesa .n{ font-family:var(--display); font-style:italic; color:var(--rosa-viejo); }
.pendiente{ font-size:.72rem; color:var(--alerta); font-weight:500; }
.acciones-fila{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:2px; }

.boton{
  font-family:var(--texto); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid var(--oro); background:transparent; color:var(--tinta);
  padding:8px 14px; border-radius:2px; cursor:pointer; text-decoration:none; display:inline-block;
}
.boton:hover{ background:var(--oro); color:#fff; }
.boton--solido{ background:var(--oro); color:#fff; }
.boton--solido:hover{ background:var(--tinta); border-color:var(--tinta); }

.vacio, .estado{ text-align:center; opacity:.6; padding:40px 12px; font-size:.9rem; }
.oculto{ display:none; }

/* ============================================================
   TEMA XV AÑOS — victoriano en rosa baby + dorado + blanco

0%3Cpath%20d%3D%27M80%2C58%20C64%2C60%2050%2C72%2052%2C88%20C54%2C100%2070%2C102%2072%2C92%20C73%2C86%2066%2C84%2064%2C88%27%2F%3E%20%3Cpath%20d%3D%27M80%2C104%20C72%2C114%2058%2C120%2046%2C116%20C40%2C114%2040%2C106%2046%2C106%27%2F%3E%20%3Cpath%20d%3D%27M80%2C128%20C70%2C132%2062%2C140%2064%2C150%27%2F%3E%20%3Cpath%20d%3D%27M54%2C74%20C44%2C72%2034%2C78%2032%2C88%20C40%2C84%2048%2C82%2054%2C74%20Z%27%2F%3E%3C%2Fg%3E%20%3Cpath%20d%3D%27M80%2C60%20C73%2C72%2073%2C88%2080%2C100%20C87%2C88%2087%2C72%2080%2C60%20Z%27%2F%3E%3Ccircle%20cx%3D%2780%27%20cy%3D%2780%27%20r%3D%273%27%2F%3E%3Cpath%20d%3D%27M80%2C104%20L80%2C128%27%2F%3E%20%3C%2Fg%3E%3C%2Fsvg%3E");
  background-repeat:repeat-y, repeat-y, repeat;
  background-position:left top, right top, top left;
  background-size:14px 14px, 14px 14px, 180px 180px;
}
h1{ font-family:var(--capitular) !important; font-style:normal !important; font-weight:700 !important; color:var(--titulo); letter-spacing:.01em; }
h2, h3{ color:var(--titulo); }
.ojo-de-cerradura, header p.sub{ color:var(--rosa-viejo) !important; }
.nav-sitio{ background:var(--vino) !important; border-bottom:2px solid var(--oro); }
.nav-sitio a{ color:var(--tinta) !important; font-weight:500; border-right-color:rgba(201,162,39,.45) !important; }
.nav-sitio a:hover{ background:var(--titulo) !important; color:#FFFFFF !important; }
.boton{ border-radius:999px !important; }
.boton:hover{ background:var(--oro); color:#FFFFFF; }

.boton--solido:hover{ background:var(--oro) !important; border-color:var(--oro) !important; }

header h1{ font-size:1.5rem; }
.dato .num{ font-family:var(--capitular); font-weight:700; color:var(--titulo); }
.pastilla-mesa{ background:var(--vino); border-color:var(--vino); }
.pastilla-mesa .n{ color:var(--titulo); font-weight:600; }
.barra input[type=text]{ border-radius:999px; padding:10px 16px; }

/* -------- lista ligada por ID -------- */
.filtros{ display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
.chip{ font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; padding:5px 12px; border-radius:999px;
       border:1px solid var(--pergamino-2); background:var(--blanco); color:var(--rosa-viejo); cursor:pointer; }
.chip.on{ background:var(--titulo); border-color:var(--titulo); color:#fff; }
.etiqueta-fila{ font-size:.58rem; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px;
                background:var(--pergamino-2); color:var(--rosa-viejo); margin-left:6px; vertical-align:middle; font-weight:500; }
.etiqueta-fila.alerta{ background:#FBE3E1; color:var(--alerta); }
.posible-dup{ border-color:#E8B4B0 !important; }
.mensaje-fila{ font-family:var(--display); font-style:italic; font-size:.95rem; margin-top:6px; opacity:.85; }
.boton--peligro{ border-color:#D9A3A0 !important; color:var(--alerta) !important; }
.boton--peligro:hover{ background:var(--alerta) !important; color:#fff !important; }
</style>

<body>

<nav class="nav-sitio">
  <a href="index.html">Dedicatorias</a>
  <a href="invitacion.html">Invitación</a>
  <a href="croquis-mesas.html">Croquis de mesas</a>
</nav>

<script>
const CONFIG = {
  urlConfirmaciones: "PEGA_AQUI_LA_URL_DE_TU_APPS_SCRIPT",
  nombreQuinceanera: "Amellali",
  // Nombre del archivo con la página personalizada de cada invitado.
  paginaInvitado: "mi-confirmacion.html"
};
</script>

<header>
  <div>
    <p class="sub">Panel privado · un invitado = una confirmación</p>
    <h1>Invitados</h1>
  </div>
  <div class="acciones">
    <a class="boton" href="invitacion.html" target="_blank" rel="noopener" title="Abrir la invitación tal como la ven los invitados">Ver invitación</a>
  </div>
</header>

<div class="resumen" id="resumen"></div>

<div class="barra">
  <input type="text" id="buscar" placeholder="Buscar invitado o teléfono…">
  <div class="filtros" id="filtros"></div>
</div>

<div id="estado" class="estado">Cargando...</div>
<div class="lista-invitados" id="lista"></div>

<script>
const $ = (id) => document.getElementById(id);

function esc(t){ const d=document.createElement("div"); d.textContent=t||""; return d.innerHTML; }
function normalizar(t){
  return (t||"").trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ");
}

/* Todo se liga por ID: la lista sale de la pestaña "Invitados" (cada quien
   se registra al confirmar) y las mesas del croquis (asign[id]). Los que se
   agregaron a mano en el croquis también aparecen, marcados "a mano". */
let invitados = [];
let croquisActual = { mesas: [], asign: {}, grupos: [] };
let busqueda = "";
let filtro = "todos";

function linkInvitado(id){
  const url = new URL(CONFIG.paginaInvitado, location.href);
  url.search = "?id=" + encodeURIComponent(id);
  return url.href;
}
function mesasDe(id){ return croquisActual.asign[id] || {}; }
function sentados(id){ return Object.values(mesasDe(id)).reduce((a,b)=>a+b,0); }
function numeroMesa(mid){ const m = croquisActual.mesas.find(x => x.id === mid); return m ? m.numero : "?"; }

/* WhatsApp: solo dígitos; si son 10 (celular de México) se antepone 52 */
function linkWhatsApp(inv){
  let tel = (inv.telefono || "").replace(/\D/g, "");
  if (!tel) return "";
  if (tel.length === 10) tel = "52" + tel;
  const mesas = Object.keys(mesasDe(inv.id)).map(numeroMesa);
  const texto = `¡Hola ${inv.nombre}! Gracias por confirmar a los XV años de ${CONFIG.nombreQuinceanera}. ` +
    (mesas.length ? `Tu lugar es en la mesa ${mesas.join(" y ")}. ` : "") +
    `Aquí puedes ver tu lugar y los datos del evento: ${linkInvitado(inv.id)}`;
  return `https://wa.me/${tel}?text=${encodeURIComponent(texto)}`;
}

function renderResumen(){
  const personas = invitados.reduce((s,i) => s + i.total, 0);
  const adultos = invitados.reduce((s,i) => s + (i.adultos || 0), 0);
  const ninos = invitados.reduce((s,i) => s + (i.ninos || 0), 0);
  const conMesa = invitados.reduce((s,i) => s + Math.min(sentados(i.id), i.total), 0);
  const sinMesa = personas - conMesa;
  $("resumen").innerHTML = `
    <div class="dato"><div class="num">${invitados.length}</div><div class="lbl">Invitados</div></div>
    <div class="dato"><div class="num">${personas}</div><div class="lbl">Personas</div></div>
    <div class="dato"><div class="num">${adultos}</div><div class="lbl">Adultos</div></div>
    <div class="dato"><div class="num">${ninos}</div><div class="lbl">Niños -12</div></div>
    <div class="dato"><div class="num">${conMesa}</div><div class="lbl">Con mesa</div></div>
    <div class="dato ${sinMesa>0?"alerta":""}"><div class="num">${sinMesa}</div><div class="lbl">Sin mesa</div></div>
  `;
}

function renderLista(){
  // nombres repetidos = posibles duplicados (alguien que confirmó desde dos celulares)
  const cuenta = {};
  invitados.forEach(i => { const k = normalizar(i.nombre); cuenta[k] = (cuenta[k] || 0) + 1; });

  let lista = invitados;
  if (busqueda) lista = lista.filter(i => normalizar(i.nombre).includes(normalizar(busqueda)) || (i.telefono||"").includes(busqueda));
  if (filtro === "sinmesa") lista = lista.filter(i => sentados(i.id) < i.total);
  if (filtro === "duplicados") lista = lista.filter(i => cuenta[normalizar(i.nombre)] > 1);

  if (!lista.length){ $("lista").innerHTML = `<p class="vacio">Sin resultados.</p>`; return; }

  $("lista").innerHTML = lista.map(inv => {
    const mapa = mesasDe(inv.id);
    const ids = Object.keys(mapa);
    const faltan = inv.total - sentados(inv.id);
    const mesasHTML = ids.length
      ? `<div class="fila-mesas">${ids.map(mid => `<span class="pastilla-mesa">Mesa <span class="n">${esc(numeroMesa(mid))}</span> · ${mapa[mid]}</span>`).join("")}</div>
         ${faltan > 0 ? `<span class="pendiente">${faltan} sin mesa</span>` : ""}`
      : `<span class="pendiente">Sin mesa asignada</span>`;
    const desglose = `${inv.adultos} adulto${inv.adultos===1?"":"s"}${inv.ninos ? ` · ${inv.ninos} niño${inv.ninos===1?"":"s"}` : ""}`;
    const wa = linkWhatsApp(inv);
    const dup = cuenta[normalizar(inv.nombre)] > 1;
    return `
      <div class="fila-invitado ${dup ? "posible-dup" : ""}">
        <div>
          <div class="nombre">${esc(inv.nombre)}
            ${inv.manual ? `<span class="etiqueta-fila">a mano</span>` : ""}
            ${dup ? `<span class="etiqueta-fila alerta">¿duplicado?</span>` : ""}</div>
          <div class="cont">${inv.total} persona${inv.total===1?"":"s"} · ${desglose}${inv.telefono ? ` · ☎ ${esc(inv.telefono)}` : ""}</div>
          ${inv.mensaje ? `<div class="mensaje-fila">«${esc(inv.mensaje)}»</div>` : ""}
          <div style="margin-top:6px;">${mesasHTML}</div>
        </div>
        <div class="acciones-fila">
          <a class="boton" href="${linkInvitado(inv.id)}" target="_blank" rel="noopener">Vista previa</a>
          <button class="boton" data-copiar="${esc(inv.id)}">Copiar link</button>
          ${wa ? `<a class="boton boton--solido" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
          ${inv.manual ? "" : `<button class="boton boton--peligro" data-eliminar="${esc(inv.id)}" data-nombre="${esc(inv.nombre)}">Eliminar</button>`}
        </div>
      </div>`;
  }).join("");

  $("lista").querySelectorAll("[data-copiar]").forEach(btn => {
    btn.addEventListener("click", () => {
      const url = linkInvitado(btn.dataset.copiar);
      navigator.clipboard.writeText(url).then(() => {
        const original = btn.textContent;
        btn.textContent = "¡Copiado!";
        setTimeout(() => { btn.textContent = original; }, 1500);
      }).catch(() => { prompt("Copia este link manualmente:", url); });
    });
  });
  $("lista").querySelectorAll("[data-eliminar]").forEach(btn => {
    btn.addEventListener("click", () => eliminar(btn.dataset.eliminar, btn.dataset.nombre, btn));
  });
}

/* Eliminar = Estado "Eliminado" en la hoja (no se borra la fila, se puede
   recuperar cambiando el Estado a "Confirmado" en Google Sheets). */
async function eliminar(id, nombre, btn){
  if (!confirm(`¿Eliminar a "${nombre}" de la lista?\n\nÚsalo para duplicados o confirmaciones por error. Si tenía mesa, su lugar se libera la próxima vez que guardes el croquis.`)) return;
  btn.disabled = true; btn.textContent = "Eliminando…";
  try{
    const r = await fetch(CONFIG.urlConfirmaciones, {
      method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ accion: "eliminarInvitado", id })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "error");
    cargar();
  }catch(err){
    alert("No se pudo eliminar: " + err.message);
    btn.disabled = false; btn.textContent = "Eliminar";
  }
}

function renderFiltros(){
  const f = [["todos","Todos"],["sinmesa","Sin mesa"],["duplicados","Posibles duplicados"]];
  $("filtros").innerHTML = f.map(([k,l]) => `<span class="chip ${filtro===k?"on":""}" data-f="${k}">${l}</span>`).join("");
  $("filtros").querySelectorAll("[data-f]").forEach(c => c.addEventListener("click", () => { filtro = c.dataset.f; renderFiltros(); renderLista(); }));
}

async function cargar(){
  $("estado").textContent = "Cargando...";
  $("estado").classList.remove("oculto");
  $("lista").innerHTML = "";
  $("resumen").innerHTML = "";

  if (!CONFIG.urlConfirmaciones || CONFIG.urlConfirmaciones.startsWith("PEGA_AQUI")){
    $("estado").textContent = "Falta configurar CONFIG.urlConfirmaciones en este archivo (la misma URL /exec que en invitacion.html).";
    return;
  }
  if (location.protocol === "file:"){
    $("estado").innerHTML =
      "Este archivo se abrió directamente desde tu computadora (doble clic), y los " +
      "navegadores bloquean ese tipo de conexión por seguridad.<br><br>" +
      "Súbelo a donde tengas hospedado el sitio y ábrelo desde esa URL.";
    return;
  }
  try{
    const [ri, rc] = await Promise.all([
      fetch(CONFIG.urlConfirmaciones + "?accion=invitados"),
      fetch(CONFIG.urlConfirmaciones + "?accion=croquis")
    ]);
    const di = await ri.json(), dc = await rc.json();
    if (!di.ok){ $("estado").textContent = "No se pudo leer la lista de invitados."; return; }
    croquisActual = Object.assign({ mesas: [], asign: {}, grupos: [] }, (dc.ok && dc.croquis) || {});
    const manuales = (croquisActual.grupos || []).filter(g => g.origen === "manual")
      .map(g => ({ id: g.id, nombre: g.nombre, total: g.total, adultos: g.total, ninos: 0, telefono: "", mensaje: "", manual: true }));
    invitados = di.invitados.concat(manuales).sort((a,b) => a.nombre.localeCompare(b.nombre, "es"));
    if (!invitados.length){ $("estado").textContent = "Todavía nadie ha confirmado."; return; }
    $("estado").classList.add("oculto");
    renderResumen();
    renderFiltros();
    renderLista();
  }catch(err){
    $("estado").innerHTML = "No se pudo conectar.<br><br><strong>Detalle técnico:</strong> " + esc(err.message);
  }
}

$("buscar").addEventListener("input", e => { busqueda = e.target.value; renderLista(); });

cargar();
</script>
</body>
</html>
